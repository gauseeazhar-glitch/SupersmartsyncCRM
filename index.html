<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Supersmartsync CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5f9;--sf:#fff;--sf2:#f5f9fc;--ink:#0b2a5b;--mut:#5a6f8c;--ln:#dce7ef;--br:#1478b8;--cy:#10b5d3;--cyl:#e0f6fb;--ok:#169c6b;--er:#d6455d;--wa:#d98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08131f;--sf:#0f2034;--sf2:#132a44;--ink:#e6f0fa;--mut:#8ea6c4;--ln:#1e3550;--br:#4ba8e6;--cyl:#10364c}}
:root[data-theme=dark]{--bg:#08131f;--sf:#0f2034;--sf2:#132a44;--ink:#e6f0fa;--mut:#8ea6c4;--ln:#1e3550;--br:#4ba8e6;--cyl:#10364c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
h2,h3,.h,.tm{font-family:Outfit,Inter,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{display:flex;height:100%}
nav{width:76px;flex:none;background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px}
nav img{width:46px;margin-bottom:10px}
nav button{width:64px;border:0;background:none;color:var(--mut);border-radius:12px;padding:8px 0;font-size:11px;font-weight:500;cursor:pointer;display:grid;justify-items:center;gap:3px;position:relative}
nav button.on{background:var(--cyl);color:var(--br)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bd{position:absolute;top:2px;right:8px;background:var(--er);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--sf);border-bottom:1px solid var(--ln)}
.wm{height:26px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .lg{background:#fff;border-radius:10px;padding:4px 6px}}
.top input{flex:1;max-width:320px;border:1px solid var(--ln);background:var(--sf2);border-radius:10px;padding:7px 12px}
.sp{flex:1}
.st{border:1px solid var(--ln);background:var(--sf2);border-radius:20px;padding:6px 12px;font-weight:500}
.st.on-call{border-color:var(--ok);color:var(--ok)}.st.wrap{border-color:var(--wa);color:var(--wa)}.st.brk{border-color:var(--er);color:var(--er)}
.me{display:flex;align-items:center;gap:8px;font-weight:500}
#view{flex:1;overflow:auto;padding:16px 18px}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--cy)}
.btn.p{background:var(--br);border-color:var(--br);color:#fff}
.btn.call{background:var(--ok);border-color:var(--ok);color:#fff;font-size:15px;padding:11px 20px}
.btn.end{background:var(--er);border-color:var(--er);color:#fff}
.btn.on{background:var(--cyl);border-color:var(--cy)}
.w{width:100%}
.card,.pn{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}
.ws{display:grid;grid-template-columns:270px minmax(0,1fr) 310px;gap:14px;height:100%}
.ws>*{overflow:auto;min-height:0}
.ctr{display:flex;flex-direction:column;gap:14px;background:none;border:0;padding:0}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mu{color:var(--mut)}small{color:var(--mut);display:block}
.ql{display:grid;gap:6px;margin-top:10px}
.qi{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.qi:hover{background:var(--sf2)}.qi.on{background:var(--cyl);border-color:var(--cy)}
.g{flex:1;min-width:0}.g b,.g small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0b2f6b,#10b5d3);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.av.l{width:52px;height:52px;font-size:18px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip{font-style:normal;font-size:11px;background:var(--sf2);border:1px solid var(--ln);border-radius:20px;padding:1px 8px;display:inline-block;margin-top:2px}
.chip.due{background:#fde8ec;color:var(--er);border-color:#f3b6c2}
.hd{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hd h2{font-size:22px}
.cl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.tm{font-size:26px;font-weight:600;min-width:84px}
.live{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:10px;border-radius:12px;background:var(--cyl)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.dp{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
textarea,.card input,.card select,dialog input{width:100%;border:1px solid var(--ln);background:var(--sf2);border-radius:10px;padding:8px 10px}
textarea{resize:vertical;min-height:62px}
label.k{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer}
details{border-top:1px solid var(--ln);padding:8px 0}summary{cursor:pointer;font-weight:500}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}dt{color:var(--mut)}dd{margin:0;text-align:right}
.tl{display:grid;gap:10px;margin-top:10px}.ti{display:flex;gap:10px}.ti .dot{margin-top:6px}
.ti p{margin:0}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;height:100%}
.col{background:var(--sf2);border:1px solid var(--ln);border-radius:14px;padding:10px;overflow:auto}
.col.ov{outline:2px dashed var(--cy)}
.deal{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-top:8px;cursor:grab}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln)}th{color:var(--mut);font-weight:500}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--sf2)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kp .h{font-size:28px;font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--cy)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ol{display:grid;grid-template-columns:110px 1fr 24px;gap:8px;align-items:center;margin:8px 0}
.hrs{display:flex;align-items:flex-end;gap:6px;height:130px}.hrs div{flex:1;background:var(--cy);border-radius:5px 5px 0 0;min-height:2px}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--ink);padding:20px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(5,15,30,.5)}dialog label{display:block;margin:10px 0 4px;color:var(--mut)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.s{opacity:1}
@media(max-width:1100px){.ws{grid-template-columns:1fr;height:auto}.ws>*{overflow:visible}}
@media(max-width:760px){.app{flex-direction:column-reverse}nav{width:100%;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--ln);padding:6px}nav img{display:none}nav button{width:auto;flex:1}.wm,.me span{display:none}#view{padding:12px}}
</style></head><body>

function sbar(){const s=$('#stat');s.innerHTML=['Available','On call','Wrap-up','Break','Training'].map(x=>`<option ${x==status?'selected':''}>${x}</option>`).join('');s.className='st '+(status=='On call'?'on-call':status=='Wrap-up'?'wrap':status=='Break'?'brk':'');s.disabled=!!call||!!wrap}
$('#stat').onchange=e=>{status=e.target.value;sbar()};
$('#q').oninput=()=>render();
function go(v){V=v;render()}
function pick(id){if(call||wrap){toast('Finish the current call first');return}sel=id;V='ws';render()}
function nextLead(){const o=open();if(!o.length)return toast('Queue is empty');const i=o.findIndex(x=>x.id==sel);pick(o[(i+1)%o.length].id)}
function startCall(){call={t0:NOW(),mute:0,hold:0};status='On call';iv=setInterval(()=>{const e=$('#tm');if(e)e.textContent=fm((NOW()-call.t0)/1e3)},500);render()}
function endCall(){clearInterval(iv);wrap={dur:Math.round((NOW()-call.t0)/1e3)};call=null;status='Wrap-up';render()}
function tog(k){call[k]^=1;render()}
function dispo(o){const c=cur(),note=$('#wn').value.trim();let x=note;
 if(o=='Callback'){const v=$('#cbt').value;c.cb=v?new Date(v).getTime():NOW()+DAY}
 else if(!['No answer','Voicemail'].includes(o))c.cb=null;
 else c.cb=NOW()+DAY;
 log(c,{k:'call',o,d:wrap.dur,x});
 const to={'Interested':c.st=='New'?'Contacted':c.st,'Demo booked':'Demo booked','Sale closed':'Won','Not interested':'Lost'}[o];
 if(to&&to!=c.st){log(c,{k:'stage',x:`${c.st} to ${to}`});c.st=to}
 wrap=null;status='Available';save();toast('Logged: '+o);if(['Won','Lost'].includes(c.st))nextLead();else render()}
function setStage(s){const c=cur();log(c,{k:'stage',x:`${c.st} to ${s}`});c.st=s;if(['Won','Lost'].includes(s))c.cb=null;render()}
function addNote(){const v=$('#nt').value.trim();if(!v)return;log(cur(),{k:'note',x:v});render()}
function quick(x){log(cur(),{k:'note',x});toast(x);render()}
function chk(i){const c=cur(),k=c.chk.indexOf(i);k<0?c.chk.push(i):c.chk.splice(k,1);save()}
function clearCb(id){const c=D.c.find(x=>x.id==id);c.cb=null;save();render()}
function addLead(){const n=$('#nn').value.trim(),b=$('#nb').value.trim(),p=$('#np').value.trim();if(!n||!p){toast('Add a name and phone number');return}
 const c=mk(Math.max(...D.c.map(x=>x.id))+1,n,b||'Unknown business','Retail','','' + p,'Unknown',0,0,'New',null,[]);D.c.unshift(c);save();dlg.close();['#nn','#nb','#np'].forEach(s=>$(s).value='');sel=c.id;V='ws';render()}
const kind={call:'#10b5d3',note:'#7a8ba3',stage:'#d98a00'};
function ws(){const c=cur(),o=open();
 const q=`<aside class="pn"><div class="ph"><h3>Queue</h3><span class="mu">${o.length} leads</span></div><button class="btn p w" onclick="nextLead()">Next lead</button><div class="ql">${o.map(x=>`<div class="qi ${x.id==c.id?'on':''}" tabindex="0" onclick="pick(${x.id})"><div class="av">${ini(x.n)}</div><div class="g"><b>${E(x.n)}</b><small>${E(x.b)}</small>${x.cb?`<em class="chip ${x.cb<=NOW()?'due':''}">${x.cb<=NOW()?'Due ':''}${cbl(x.cb)}</em>`:''}</div><i class="dot" style="background:${SC[x.st]}"></i></div>`).join('')||'<p class="mu">No leads match your search.</p>'}</div></aside>`;
 let act;
 if(wrap)act=`<div class="live" style="display:block"><b class="h">Wrap up call (${fm(wrap.dur)})</b><textarea id="wn" placeholder="Call notes" style="margin-top:8px"></textarea><div class="dp"><span class="mu">Callback time</span><input id="cbt" type="datetime-local" style="width:auto"></div><div class="dp">${DISP.map(d=>`<button class="btn" onclick="dispo('${d}')">${d}</button>`).join('')}</div></div>`;
 else if(call)act=`<div class="live"><span class="pulse"></span><span class="tm" id="tm">${fm((NOW()-call.t0)/1e3)}</span><span class="sp"></span><button class="btn ${call.mute?'on':''}" onclick="tog('mute')">${call.mute?'Unmute':'Mute'}</button><button class="btn ${call.hold?'on':''}" onclick="tog('hold')">${call.hold?'Resume':'Hold'}</button><button class="btn end" onclick="endCall()">End call</button></div>`;
 else act=`<div class="cl"><button class="btn call" onclick="startCall()" ${status=='Break'?'disabled':''}>Call ${E(c.ph)}</button><button class="btn" onclick="quick('Sent intro text')">Send intro text</button><button class="btn" onclick="quick('Emailed demo link')">Email demo link</button></div>`;
 const mid=`<div class="ctr"><div class="card"><div class="hd"><div class="av l">${ini(c.n)}</div><div><h2>${E(c.n)}</h2><div class="mu">${E(c.b)} · ${E(c.t)}${c.c?' · '+E(c.c):''}</div></div><span class="sp"></span><span class="chip" style="font-size:13px"><i class="dot" style="background:${SC[c.st]};display:inline-block;margin-right:6px"></i>${c.st}</span></div>${act}</div>
 <div class="card"><h3>Call guide</h3><p>Hi ${E(c.n.split(' ')[0])}, this is Priya from Supersmartsync. Do you have two minutes? I'm calling about how ${E(c.b)} rings up sales and what you pay in card fees.</p>${CHK.map((t,i)=>`<label class="k"><input type="checkbox" ${c.chk.includes(i)?'checked':''} onchange="chk(${i})" style="width:auto;margin-top:3px">${t}</label>`).join('')}
 <details><summary>"We're under contract"</summary><p class="mu">Ask for the end date and fees to leave. We migrate products, pricing, taxes and users, so switching can wait until the term ends.</p></details>
 <details><summary>"Our current system works fine"</summary><p class="mu">Ask what they pay in processing fees each month and how they track shrink today. Offer a savings estimate.</p></details>
 <details><summary>"Send me an email"</summary><p class="mu">Agree, then confirm the best address and book a 10 minute follow-up call before hanging up.</p></details></div>
 <div class="card"><h3>Add note</h3><textarea id="nt" placeholder="What did you learn?" style="margin:8px 0"></textarea><button class="btn" onclick="addNote()">Save note</button></div></div>`;
 const rt=`<aside class="pn"><h3 style="margin-bottom:10px">Account</h3><dl><dt>Phone</dt><dd>${E(c.ph)}</dd><dt>Email</dt><dd>${E(c.em)}</dd><dt>Current POS</dt><dd>${E(c.pos)}</dd><dt>Card volume</dt><dd>${c.vol?'$'+c.vol+'k / mo':'Unknown'}</dd><dt>Deal value</dt><dd>${c.val?$$(c.val)+' / mo':'Unknown'}</dd><dt>Callback</dt><dd>${c.cb?cbl(c.cb):'None'}</dd><dt>Stage</dt><dd><select onchange="setStage(this.value)" style="width:auto">${ST.map(s=>`<option ${s==c.st?'selected':''}>${s}</option>`).join('')}</select></dd></dl>
 <div class="dp">${c.tags.map(t=>`<span class="chip">${E(t)}</span>`).join('')}</div><h3>Activity</h3><div class="tl">${c.act.map(a=>`<div class="ti"><i class="dot" style="background:${kind[a.k]}"></i><div><p><b>${a.k=='call'?'Call · '+a.o+(a.d?' ('+fm(a.d)+')':''):a.k=='stage'?'Stage: '+a.x:'Note'}</b></p>${a.k!='stage'&&a.x?`<p>${E(a.x)}</p>`:''}<small>${agof(a.t)}</small></div></div>`).join('')||'<p class="mu">No activity yet. Make the first call.</p>'}</div></aside>`;
 return `<div class="ws">${q}${mid}${rt}</div>`}
function pipe(){return `<div class="kb">${ST.map(s=>{const l=D.c.filter(x=>x.st==s&&match(x));return `<div class="col" ondragover="event.preventDefault();this.classList.add('ov')" ondragleave="this.classList.remove('ov')" ondrop="drop(event,'${s}')"><div class="ph"><b class="h"><i class="dot" style="background:${SC[s]};display:inline-block;margin-right:6px"></i>${s} (${l.length})</b><span class="mu">${$$(l.reduce((a,x)=>a+x.val,0))}</span></div>${l.map(x=>`<div class="deal" draggable="true" ondragstart="event.dataTransfer.setData('t','${x.id}')" onclick="pick(${x.id})"><b>${E(x.b)}</b><small>${E(x.n)} · ${E(x.t)}</small><div class="mu" style="margin-top:4px">${x.val?$$(x.val)+' / mo':'No value yet'}</div></div>`).join('')}</div>`}).join('')}</div>`}
function drop(e,s){e.preventDefault();const c=D.c.find(x=>x.id==e.dataTransfer.getData('t'));if(c&&c.st!=s){log(c,{k:'stage',x:`${c.st} to ${s}`});c.st=s;if(['Won','Lost'].includes(s))c.cb=null;save()}render()}
function cons(){const l=D.c.filter(x=>match(x)&&(fl=='All'||x.st==fl));return `<div class="card"><div class="ph"><h3>Contacts (${l.length})</h3><select onchange="fl=this.value;render()" style="width:auto;border:1px solid var(--ln);border-radius:10px;padding:6px;background:var(--sf2)">${['All',...ST].map(s=>`<option ${s==fl?'selected':''}>${s}</option>`).join('')}</select></div><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Business</th><th>Type</th><th>Phone</th><th>Current POS</th><th>Stage</th><th>Value</th></tr></thead><tbody>${l.map(x=>`<tr onclick="pick(${x.id})"><td><b>${E(x.n)}</b></td><td>${E(x.b)}</td><td>${E(x.t)}</td><td>${E(x.ph)}</td><td>${E(x.pos)}</td><td><i class="dot" style="background:${SC[x.st]};display:inline-block;margin-right:6px"></i>${x.st}</td><td>${x.val?$$(x.val):'-'}</td></tr>`).join('')}</tbody></table></div></div>`}
function cbs(){const l=D.c.filter(x=>x.cb&&match(x)).sort((a,b)=>a.cb-b.cb);return `<div class="card" style="max-width:760px"><div class="ph"><h3>Scheduled callbacks</h3><span class="mu">${l.length}</span></div>${l.map(x=>`<div class="qi" style="cursor:default"><div class="av">${ini(x.n)}</div><div class="g"><b>${E(x.n)} · ${E(x.b)}</b><small>${x.cb<=NOW()?'Overdue since ':''}${cbl(x.cb)} · ${E(x.ph)}</small></div><button class="btn" onclick="clearCb(${x.id})">Done</button><button class="btn p" onclick="pick(${x.id})">Open</button></div>`).join('')||'<p class="mu">No callbacks scheduled. Log a Callback outcome after a call to add one.</p>'}</div>`}
function dash(){const cl=D.c.flatMap(c=>c.act.filter(a=>a.k=='call'&&a.t>ago(600)));const n=cl.length,tk=cl.reduce((a,x)=>a+(x.d||0),0),cn=cl.filter(x=>!['No answer','Voicemail'].includes(x.o)).length,dm=cl.filter(x=>x.o=='Demo booked').length,pv=D.c.filter(x=>!['Won','Lost'].includes(x.st)).reduce((a,x)=>a+x.val,0);
 const mx=Math.max(1,...DISP.map(d=>cl.filter(x=>x.o==d).length)),hr=[...Array(10)].map((_,i)=>cl.filter(x=>x.t>ago(600-i*60-60)&&x.t<=ago(600-i*60)).length),hm=Math.max(1,...hr);
 return `<div class="kp"><div class="card"><small>Calls this shift</small><div class="h">${n}</div><div class="bar"><i style="width:${Math.min(100,n/40*100)}%"></i></div><small>Goal: 40</small></div><div class="card"><small>Talk time</small><div class="h">${fm(tk)}</div><small>min : sec</small></div><div class="card"><small>Connect rate</small><div class="h">${n?Math.round(cn/n*100):0}%</div></div><div class="card"><small>Demos booked</small><div class="h">${dm}</div></div><div class="card"><small>Open pipeline</small><div class="h">${$$(pv)}</div><small>per month</small></div></div>
 <div class="row2"><div class="card"><h3>Outcomes</h3>${DISP.map(d=>{const k=cl.filter(x=>x.o==d).length;return `<div class="ol"><span>${d}</span><div class="bar"><i style="width:${k/mx*100}%"></i></div><b>${k}</b></div>`}).join('')}</div><div class="card"><h3>Calls per hour (last 10 hours)</h3><div class="hrs" style="margin-top:14px">${hr.map(k=>`<div title="${k} calls" style="height:${k/hm*100}%"></div>`).join('')}</div></div></div>`}
function render(){nav();sbar();$('#view').innerHTML={ws,pipe,cons,cbs,dash}[V]()}
render();setInterval(()=>{if(!call&&!wrap&&V=='cbs')render();nav()},30000);
</script></body></html>
